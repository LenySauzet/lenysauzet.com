interests:
  - Shipping my own products end to end, on whatever surface the problem needs (web, mobile, terminal, GPU, XR, on-device AI).
  - Writing deep dives on my blog, with interactive playgrounds that make a hard topic usable.
  - Reverse-engineering formats, rendering tricks and state-of-the-art codebases to see how they are really built.
  - Following the designers, creative developers and 3D artists doing the best work on the web.

recommendations:
  - author: Matthieu Bietry
    role: CTO and co-founder, Tolk.ai
    relation: My direct manager during the work-study
    date: 2026-10-05
    language: fr
    quote: >-
      J'ai encadré Lény pendant ses deux ans en alternance au sein de l'équipe technique de
      Tolk.ai. Lény est arrivé en tant que développeur sur l'intégration de nos briques IA dans
      notre produit Genii. Sérieux, impliqué et réellement passionné, il a su mettre en place, et
      en autonomie des fonctionnalités de plus en plus ambitieuses.
  - author: Ulysse Bottello
    role: Product Lead, Tolk.ai
    relation: Senior to me at Tolk.ai, not my direct manager
    date: 2026-09-30
    language: fr
    quote: >-
      J'ai eu le plaisir de travailler avec Lény. Il a pris en charge certains des sujets les plus
      complexes de notre produit : notre fonctionnalité cœur, toute la partie LLM et l'exploitation
      de la donnée. Lény ne s'est jamais laissé arrêter par la complexité. Au contraire, il
      s'appropriait chaque sujet et le suivait jusqu'au bout : pas seulement jusqu'à la mise en
      production, mais jusqu'à son adoption et son succès. Au-delà du travail, collaborer avec lui a
      toujours été un vrai plaisir. Je le recommande sans hésitation à toute équipe à la recherche
      d'un développeur solide, autonome et profondément impliqué.
  - author: Joey Galligani
    role: Classmate, Epitech Montpellier
    relation: Studied with me at Epitech Montpellier
    date: 2026-09-21
    language: fr
    quote: >-
      J'ai fait mes études à EPITECH Montpellier avec Lény, et c'est le genre de développeur qu'on
      veut dans son équipe : curieux, autonome, et toujours prêt à s'arrêter sur le problème de
      quelqu'un d'autre. Techniquement, il apprend vite et écrit du code propre. Humainement, il
      reste calme quand ça chauffe et dit les choses franchement quand une piste ne mène nulle part.
      Travailler avec lui a été un vrai plaisir. Je le recommande les yeux fermés.
