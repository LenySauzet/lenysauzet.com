headline: AI & Software Engineer
summary: >-
  I build software end to end, from the design of an interface to its life in production,
  on whatever surface the problem needs: web, mobile, terminal or GPU. For nearly three years
  I was an AI and full-stack engineer at Tolk.ai, in work-study, on Genii, its conversational
  AI platform for businesses: I owned the ingestion and retrieval pipelines the product rests
  on, and grew from the AI services to the whole stack, alongside an AI specialisation at
  Epitech. Outside of work I ship my own products and write about what I learn on my blog.

