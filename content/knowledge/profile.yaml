experience:
  - company: Tolk.ai
    role: AI & Software Engineer
    location: Montpellier, France
    arrangement: hybrid
    contract: work-study
    start: 2024-01
    end: 2026-09
    summary: >-
      AI and full-stack engineer on Genii, Tolk.ai's conversational AI platform for businesses,
      in a team of seventeen working in short cycles with code review on every change.
    highlights:
      - >-
        Opened a new market: knowledge bases that keep themselves current made dynamic-catalogue
        e-commerce possible. That pipeline carries 80% of the live knowledge base, 345,000 pages
        across 90 customer projects.
      - >-
        Owned the ingestion and retrieval pipelines the product's credibility rests on, across
        600 million indexed words and 4.3 million conversations served.
      - >-
        Turned raw conversation data into analytics customers pay for: 1.4 million conversations
        summarised, classified by theme, scored for sentiment and resolution, and stripped of
        personal data, automatically and at scale.
      - >-
        Generated follow-up questions automatically from every ingested document, 3.4 million of
        them, linked back to their source passage, with nothing for the customer to configure.
      - >-
        Built a direct enterprise integration end to end that satisfied a customer's security team
        and closed the contract.
      - >-
        Grew from a specialist on the AI services to the full stack, trusted with a feature from
        the first conversation to production.
      - Brought AI-assisted development into the team.
